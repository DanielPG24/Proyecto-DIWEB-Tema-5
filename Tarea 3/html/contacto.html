<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - NEXO</title>
</head>

<body>
    <header>
        <div>
            <img src="/Tarea 3/assets/nexo_logo.png" alt="logo nexo" style="width: 500px; height: 300px;">
            <nav>
                <ul>
                    <li><a href="/Tarea 3/index.html" style="text-decoration: none;">Inicio</a></li>
                    <li><a href="/Tarea 3/html/actividades.html" style="text-decoration: none;">Actividades</a></li>
                    <li><a href="/Tarea 3/html/tarifas.html" style="text-decoration: none;">Tarifas</a></li>
                    <li><a href="/Tarea 3/html/conocenos.html" style="text-decoration: none;">Conócenos</a></li>
                    <li><a href="/Tarea 3/html/contacto.html" style="text-decoration: none;">Contacto</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section id="contacto">
            <h1>Contacto y Ubicación</h1>
            <p><strong>Horario:</strong> Lunes a Viernes de 07:00 a 22:30 | Sábados de 09:00 a 14:00</p>
            <p><strong>Teléfono:</strong> 600 000 000</p>
            <p><strong>Email:</strong> info@nexoclub.es</p>

            <h2>Envíanos un mensaje</h2>
            <form action="#" method="post">
                <p>
                    <label for="nombre">Nombre:</label><br>
                    <input type="text" id="nombre" name="nombre" required>
                </p>
                <p>
                    <label for="email">Correo electrónico:</label><br>
                    <input type="email" id="email" name="email" required>
                </p>
                <p>
                    <label for="mensaje">Consulta:</label><br>
                    <textarea id="mensaje" name="mensaje" rows="4" required></textarea>
                </p>
                <button type="submit">Enviar</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; NEXO</p>
    </footer>
</body>

</html>
